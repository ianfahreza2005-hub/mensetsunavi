<body>
<div id="rak" hidden><iframe id="rakf" title="Rak bab Mensetsu Navi" style="border:0;width:100%;height:100%;display:block"></iframe></div>
<aside id="navi-saran" hidden aria-label="Saran dari Navi"></aside>
<main id="view" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<noscript><p style="padding:24px">Mensetsu Navi membutuhkan JavaScript. Aktifkan JavaScript di peramban.</p></noscript>
<script src="js/data/kursus.js?v=8575179d4d"></script>
<script src="js/data/tampilan.js?v=8575179d4d"></script>
<script src="js/store.js?v=8575179d4d"></script>
<script>
  /* rak 3D tinggal di iframe agar gaya dan render-nya terpisah dari aplikasi */
  (function () {
    var f = document.getElementById('rakf'), ready = false, want = null;
    f.addEventListener('load', function () { ready = true; if (want) window.MN_RAK[want](); });
    window.MN_RAK = {
      show: function () {
        if (!f.src) f.src = 'rak.html';
        if (!ready) { want = 'show'; return; }
        try { f.contentWindow.MN_RAK_PAUSE && f.contentWindow.MN_RAK_PAUSE(false); f.contentWindow.MN_RAK_RESET && f.contentWindow.MN_RAK_RESET(); f.focus(); } catch (e) {}
      },
      hide: function () {
        if (!ready) { want = null; return; }
        try { f.contentWindow.MN_RAK_PAUSE && f.contentWindow.MN_RAK_PAUSE(true); } catch (e) {}
      }
    };
  })();
</script>
