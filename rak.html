<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Rak bab · Mensetsu Navi</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@500;700&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
<!--
  Rak Bab Mensetsu Navi — prototipe gerak layar pemilihan bab.
  Mekanik rak 3D, panel sobekan kertas, blur latar, hover/drag diadaptasi dari
  "Ashen Press" (ThreeUI oleh Meng To, threeui.com), Three.js r181 (MIT).
  Isi, sampul, warna, alur Buka/Tutup, kunci, dan penanda selesai dibuat ulang untuk Mensetsu Navi.
-->
<style>
  :root{
    --bg:#D8D6DE;
    --ink:#14171F;
    --ink-soft:rgba(22,33,62,.66);
    --paper:#fbf7ef;
    --good:#23784A; --goodL:#E1F3E8; --warn:#8F5600; --warnL:#FCEFD6; --hanko:#B3282F;
    --ease:cubic-bezier(.22,1,.36,1);
    --sans:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --mincho:"Shippori Mincho","Noto Serif JP","Hiragino Mincho ProN",serif;
    --jp:"Noto Sans JP","Hiragino Sans",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  button{font-family:inherit}
  button:focus-visible,a:focus-visible{outline:3px solid #0F4C81;outline-offset:3px}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;
    touch-action:none;user-select:none;-webkit-user-select:none;
    opacity:0;transition:opacity 1s linear}
  canvas#gl.on{opacity:1}

  /* ---------- header ---------- */
  header{
    position:fixed;top:0;left:0;right:0;height:64px;z-index:20;
    display:flex;align-items:center;padding:0 20px;gap:28px;
    font-size:15px;font-weight:600;
  }
  .brand{display:flex;align-items:center;gap:11px}
  .mark{width:30px;height:30px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
  .mark svg{width:17px;height:17px}
  .brandname{font-size:20px;font-weight:800;white-space:nowrap;letter-spacing:-.01em}
  .brandjp{font-family:var(--jp);font-size:13px;font-weight:500;color:var(--ink-soft);margin-left:2px}
  header .right{margin-left:auto;display:flex;align-items:center;gap:6px}
  .pill{background:var(--ink);color:#f6efe1;padding:10px 16px 10px 10px;border-radius:999px;
    white-space:nowrap;display:flex;align-items:center;gap:8px;font-size:14px}
  .pill .av{width:26px;height:26px;border-radius:50%;background:#B3282F;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}

  /* ---------- the opening: every element on its own beat ---------- */
  .rise{opacity:0;transform:translateY(13px);
    transition:opacity .74s var(--ease) var(--d,0ms),transform .74s var(--ease) var(--d,0ms)}
  .rise.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){
    .rise{transform:none;transition:opacity .3s linear var(--d,0ms)}
  }

  /* ---------- panel gambaran bab (sobekan kertas dari kiri) ---------- */
  .wash{position:fixed;left:0;top:0;z-index:14;height:100vh;
    width:min(680px,62vw);pointer-events:none;display:block}
  body.mobile .wash{display:none}
  .detail{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:16;
    width:min(580px,52vw);padding:84px 110px 84px 54px;opacity:0;pointer-events:none;
    transition:opacity .45s var(--ease) .14s}
  .detail>*{max-width:350px}
  .detail.on{opacity:1}
  .detail.on .acts button{pointer-events:auto}
  .detail .meta{font-size:14px;font-weight:600;color:var(--ink-soft);margin:0 0 10px}
  .detail h2{font-weight:800;font-size:40px;line-height:1.06;margin:0 0 6px;letter-spacing:-.02em;text-wrap:balance}
  .detail .jp{font-family:var(--mincho);font-weight:600;font-size:21px;margin:0 0 16px;color:var(--ink-soft)}
  .detail p.desc{font:400 16px/1.6 var(--sans);margin:0 0 16px;color:rgba(22,33,62,.86)}
  .status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;
    padding:7px 12px 7px 8px;border-radius:999px;margin:0 0 16px}
  .status .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--jp);font-size:12px;font-weight:700}
  .st-done{background:var(--goodL);color:var(--good)}
  .st-done .dot{border:2px solid var(--hanko);color:var(--hanko);background:#fff;transform:rotate(-12deg)}
  .st-now{background:#fff;color:var(--ink)}
  .st-now .dot{background:conic-gradient(var(--c) var(--p), #e4ded2 0);}
  .st-new{background:rgba(255,255,255,.7);color:var(--ink)}
  .st-new .dot{background:var(--c);color:#fff;font-family:var(--sans);font-weight:800}
  .st-saran{background:var(--warnL);color:var(--warn)}
  .lessons{list-style:none;margin:0 0 26px;padding:0;display:flex;flex-direction:column;gap:6px}
  .lessons li{display:flex;gap:10px;align-items:baseline;font-size:14.5px;line-height:1.4}
  .lessons b{flex:none;width:28px;font-size:12px;font-weight:800;color:var(--c)}
  .acts{display:flex;gap:10px;flex-wrap:wrap}
  .acts button,.mbar-acts button,.ov-acts button{
    font:700 15px/1 var(--sans);color:var(--ink);background:#fdf8ef;border:0;
    border-radius:999px;padding:15px 24px;min-height:48px;cursor:pointer;
    transition:transform .22s var(--ease),box-shadow .22s var(--ease),background .22s;
    box-shadow:0 1px 1px rgba(52,34,16,.18),
               0 3px 6px rgba(52,34,16,.14),
               0 10px 20px -6px rgba(52,34,16,.26),
               0 26px 44px -18px rgba(52,34,16,.34),
               inset 0 1px 0 rgba(255,255,255,.85)}
  .acts button.solid,.mbar-acts button.solid,.ov-acts button.solid{background:var(--c,#16213E);color:#fff;
    box-shadow:0 1px 1px rgba(22,33,62,.2),0 6px 14px -2px rgba(22,33,62,.3),0 20px 40px -16px rgba(22,33,62,.45),inset 0 1px 0 rgba(255,255,255,.25)}
  .acts button:hover{transform:translateY(-2px)}
  .acts button:active{transform:translateY(0)}

  .hint{position:fixed;z-index:16;left:0;top:0;transform:translate(10px,10px);
    background:#fdf8ef;color:var(--ink);border-radius:999px;padding:8px 13px;
    font:600 13px/1 var(--sans);box-shadow:0 2px 14px rgba(50,35,20,.2);
    pointer-events:none;opacity:0;transition:opacity .5s}
  .hint.on{opacity:1}

  /* ---------- toast bab terkunci ---------- */
  .toast{position:fixed;left:50%;top:84px;z-index:40;transform:translate(-50%,-12px);
    display:flex;gap:10px;align-items:center;max-width:min(440px,calc(100vw - 32px));
    background:var(--ink);color:#fff;border-radius:18px;padding:12px 16px;font-size:14px;line-height:1.45;
    box-shadow:0 14px 34px -10px rgba(22,33,62,.5);opacity:0;pointer-events:none;
    transition:opacity .3s var(--ease),transform .3s var(--ease)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast svg{flex:none}

  /* ---------- rel katalog bawah ---------- */
  footer{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:26px 0 20px;
    background:linear-gradient(to top,rgba(220,210,194,.95) 46%,rgba(220,210,194,.62) 76%,rgba(220,210,194,0));
    border-top:1px solid rgba(22,33,62,.14);opacity:0;transition:opacity .7s var(--ease) .34s}
  footer.on{opacity:1}
  body.reading footer{opacity:.3;pointer-events:none}
  .tl{display:flex;justify-content:space-between;align-items:center;
    gap:clamp(9px,1.2vw,22px);padding:0 clamp(14px,2.5vw,44px);
    overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    mask-image:linear-gradient(90deg,transparent 0,#000 26px,#000 calc(100% - 26px),transparent 100%);
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 26px,#000 calc(100% - 26px),transparent 100%)}
  .tl::-webkit-scrollbar{display:none}
  .tli{background:none;border:0;padding:4px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);
    flex:0 0 auto;display:flex;align-items:center;gap:10px;border-radius:12px;min-height:48px}
  .tlmark{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
    transition:transform .4s var(--ease);font-weight:800;font-size:14px}
  .tli:hover .tlmark{transform:translateY(-1px) scale(1.06)}
  .tlm-done{border:2.5px solid var(--hanko);color:var(--hanko);background:#fffaf4;font-family:var(--jp);font-size:16px;transform:rotate(-12deg)}
  .tli:hover .tlm-done{transform:rotate(-12deg) scale(1.06)}
  .tlm-now{background:conic-gradient(var(--c) var(--p), rgba(22,33,62,.14) 0)}
  .tlm-now i{width:28px;height:28px;border-radius:50%;background:#efe8dc;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800}
  .tlm-new{background:var(--c);color:#fff}
  .tlm-lock{background:rgba(22,33,62,.12);color:var(--ink-soft)}
  .tltxt{display:block;min-width:0;white-space:nowrap}
  .tli p{margin:0 0 2px;font-size:12px;line-height:1.24;color:var(--ink-soft);font-weight:600}
  .tli h2{margin:0;font-size:14px;font-weight:700;line-height:1.22;white-space:nowrap}
  .tli.locked h2{color:var(--ink-soft)}
  .tli.pop .tlmark{animation:pop .7s var(--ease)}
  @keyframes pop{0%{transform:scale(2.2) rotate(-30deg);opacity:0}60%{transform:scale(.92) rotate(-10deg);opacity:1}100%{transform:scale(1) rotate(-12deg)}}

  /* ---------- HP: tumpukan yang digeser ---------- */
  .mbar{position:fixed;left:0;right:0;bottom:0;z-index:18;display:none;
    flex-direction:column;gap:12px;padding:16px 16px 22px;
    opacity:0;transition:opacity .6s var(--ease)}
  .mbar.on{opacity:1}
  .mrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .mbar-txt p{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--ink-soft)}
  .mbar-txt h2{margin:0;font-size:22px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
  .mbar-more{display:none;flex-direction:column;gap:10px}
  body.reading .mbar-more{display:flex}
  .mbar-more p{margin:0;font-size:15px;line-height:1.55}
  .mbar-more .status{margin:0;align-self:flex-start}
  .mbar-acts{display:flex;gap:8px;flex:0 0 auto}
  .mbar-acts button{padding:15px 20px}
  .menubtn{position:fixed;right:10px;top:10px;z-index:22;width:44px;height:44px;border:0;
    background:none;display:none;flex-direction:column;justify-content:center;align-items:center;gap:6px;cursor:pointer}
  .menubtn span{display:block;width:24px;height:2px;background:var(--ink);border-radius:2px}
  .menu{position:fixed;inset:0;z-index:21;background:rgba(232,224,211,.97);backdrop-filter:blur(14px);
    padding:70px 20px 24px;display:flex;flex-direction:column;overflow:auto}
  .menu[hidden]{display:none}
  .menu button{background:none;border:0;text-align:left;padding:13px 4px;cursor:pointer;min-height:48px;
    border-bottom:1px solid rgba(22,33,62,.14);color:var(--ink);font-size:19px;font-weight:700}
  .menu button span{display:block;margin-bottom:4px;font-size:12px;font-weight:600;color:var(--ink-soft)}

  body.mobile footer{display:none}
  body.mobile .mbar{display:flex;padding-top:52px;
    background:linear-gradient(to top,rgba(226,217,203,.98) 46%,rgba(226,217,203,.78) 74%,rgba(226,217,203,0))}
  .menubtn{display:flex}
  body.mobile .mrow{flex-direction:column;align-items:stretch;gap:14px}
  body.mobile .mbar-acts button{flex:1}
  body.mobile header{padding:0 14px;gap:10px}
  header .right{margin-right:48px}
  body.mobile .brandjp,body.mobile .pill .tx{display:none}
  body.mobile .pill{padding:6px}
  body.mobile .detail{display:none}
  body.opening .mbar,body.opening footer{opacity:0!important;pointer-events:none}
  /* selam ke halaman judul: bingkai rak ikut menghilang, yang tersisa hanya buku */
  header,.hint{transition:opacity .35s var(--ease)}
  .menubtn{transition:opacity .35s var(--ease)}
  body.menyelam header,body.menyelam footer,body.menyelam .hint,body.menyelam .menubtn{opacity:0!important;pointer-events:none}
  body.menyelam{pointer-events:none}

  @media (max-height:760px) and (min-width:768px){
    .detail{padding-top:64px;padding-bottom:96px}
    .lessons{display:none}
  }
  /* HP landscape / layar pendek */
  @media (max-height:560px) and (min-width:768px){
    header{height:52px}
    .detail{padding:56px 90px 70px 32px}
    .detail h2{font-size:28px}.detail .jp{font-size:17px;margin-bottom:8px}
    .detail p.desc{font-size:14px;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .lessons{display:none}
    .status{margin-bottom:12px}
    footer{padding:14px 0 10px}
  }

  /* ---------- sampul bab setelah buku dibuka ---------- */
  .ov{position:fixed;inset:0;z-index:30;background:#EEECF1;opacity:0;pointer-events:none;
    transition:opacity .5s linear;overflow:auto;display:flex;flex-direction:column}
  .ov.on{opacity:1;pointer-events:auto}
  .ov[hidden]{display:none}
  .ov-hero{position:relative;flex:none;min-height:min(46vh,380px);background:var(--c);color:#fff;
    display:flex;flex-direction:column;justify-content:flex-end;padding:20px clamp(18px,6vw,72px) 46px;overflow:hidden}
  .ov-hero svg.sg{position:absolute;inset:0;width:100%;height:100%}
  .ov-top{position:absolute;top:16px;left:clamp(12px,4vw,40px);right:clamp(12px,4vw,40px);display:flex;justify-content:space-between;gap:10px}
  .ov-back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px 0 10px;border-radius:999px;border:0;
    background:rgba(255,255,255,.92);color:var(--ink);font:700 14px/1 var(--sans);cursor:pointer}
  .ov-chip{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.16);font-size:13px;font-weight:700}
  .ov-kj{position:relative;font-family:var(--mincho);font-weight:800;font-size:clamp(56px,11vw,120px);line-height:1;opacity:.95}
  .ov-eyebrow{position:relative;font-size:14px;font-weight:700;opacity:.85;margin-top:10px}
  .ov-body{position:relative;margin:-26px auto 0;width:min(760px,calc(100% - 24px));background:#fff;border-radius:26px;
    box-shadow:0 18px 40px -16px rgba(22,33,62,.25);padding:clamp(20px,4vw,36px);display:flex;flex-direction:column;gap:14px}
  .ov-body h1{margin:0;font-size:clamp(26px,4.2vw,38px);line-height:1.08;letter-spacing:-.02em}
  .ov-body p{margin:0;font-size:16px;line-height:1.6;color:rgba(22,33,62,.86)}
  .ov-les{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  .ov-les li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:#F5F4F8;font-weight:700;font-size:15px}
  .ov-les li b{width:34px;height:34px;flex:none;border-radius:11px;background:var(--cl);color:var(--c);display:grid;place-items:center;font-size:13px}
  .ov-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .ov-note{font-size:12.5px;color:var(--ink-soft)}
  .ov-pad{height:32px;flex:none}

  /* ---------- loader / fallback ---------- */
  .loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
    background:var(--bg);transition:opacity .6s linear;pointer-events:none}
  .loader.gone{opacity:0}
  .bar{width:92px;height:2px;background:rgba(22,33,62,.2);position:relative;overflow:hidden}
  .bar i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:var(--ink);
    transition:transform .3s linear}
  .nogl{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:24px;background:var(--bg);text-align:center;font-size:16px;line-height:1.6}
</style>
</head>
<body>
<canvas id="gl" aria-label="Rak buku bab Mensetsu Navi"></canvas>

<header>
  <div class="brand">
    <span class="mark rise" data-d="0"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.2 6.3L20.5 12l-6.3 2.7L12 21l-2.2-6.3L3.5 12l6.3-2.7z" fill="#F7EFE0"/><circle cx="12" cy="12" r="2" fill="#B3282F"/></svg></span>
    <span class="brandname rise" data-d="70">Mensetsu Navi <span class="brandjp">面接ナビ</span></span>
  </div>
  <div class="right">
    <span class="pill rise" data-d="285"><span class="av">R</span><span class="tx" id="pilltx">Rani · 2 dari 6 stempel</span></span>
  </div>
</header>

<canvas class="wash" id="wash" aria-hidden="true"></canvas>
<section class="detail" id="detail" aria-live="polite">
  <p class="meta" id="detail-meta"></p>
  <h2 id="detail-title"></h2>
  <p class="jp" id="detail-jp" lang="ja"></p>
  <span class="status" id="detail-status"></span>
  <p class="desc" id="detail-desc"></p>
  <ul class="lessons" id="detail-lessons"></ul>
  <div class="acts">
    <button class="solid" id="detail-open">Buka bab</button>
    <button id="detail-close">Tutup</button>
  </div>
</section>

<div class="hint" id="hint">Seret untuk memutar · ketuk untuk lihat isi</div>
<div class="toast" id="toast" role="status"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F0B9BC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span id="toast-tx"></span></div>

<footer><div class="tl" id="tl"></div></footer>

<div class="mbar" id="mbar">
  <div class="mbar-more" id="mbar-more">
    <span class="status" id="mbar-status"></span>
    <p id="mbar-desc"></p>
  </div>
  <div class="mrow">
    <div class="mbar-txt"><p id="mbar-meta"></p><h2 id="mbar-title"></h2></div>
    <div class="mbar-acts">
      <button id="mbar-details">Detail</button>
      <button class="solid" id="mbar-open">Buka</button>
    </div>
  </div>
</div>
<button class="menubtn" id="menubtn" aria-label="Menu"><span></span><span></span><span></span></button>
<nav class="menu" id="menu" hidden aria-label="Daftar bab"></nav>



<div class="nogl" id="nogl"><div style="max-width:420px;width:100%"><b>Perangkat ini belum mendukung tampilan 3D.</b><br>Pilih bab dari daftar:<div id="nogl-list" style="display:flex;flex-direction:column;gap:8px;margin-top:14px"></div></div></div>
<div class="loader" id="loader"><div class="bar"><i id="barfill"></i></div></div>


<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ════════════════════════════════════════════════════════════════════════
   1 · THE CATALOGUE
   ════════════════════════════════════════════════════════════════════════ */
const K = {
  bookW: 0.887, bookH: 1.33, bookD: 0.17,    // 2:3, the format the plates are shot at
  lean: -0.20, yaw: 0.155,
  bow: 0.0080, chamf: 0.0135, chamfR: 0.022,
  shelfTop: [0.251, -1.241],
  plankHalf: 2.62, plankThick: 0.105, plankDepth: 0.80,
  wallZ: -1.43, bookZ: -1.18,
  slot: 1.235, coverOpen: -2.72, openDur: 760, pushDur: 620,
  activeDuration: 700, hoverDrop: 400, hoverLift: 1000,
  introStagger: 78, introWallFade: 1000, introFade: 460,
  fov: 20,
  boxX: 4.80, boxY: 3.36, boxCY: 0.06, offset: 1.25, maxWidthPx: 1550,
  orbitAz: 0.085, orbitEl: 0.052,
  activeX: 0.72, activeRot: [0.075, 0.285, 0.0],
  mTilt: -Math.PI/7, mFlat: -0.06,
  mStepZ: 0.15, mStepY: 0.17, mY: 0.30, mZ0: 0.75,
  mFill: 0.62, mDrop: 0.22,
};
const MOBILE_Q = window.matchMedia('(max-width: 767px)');
let MOBILE = MOBILE_Q.matches;
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(REDUCED){ K.introStagger=0; K.introWallFade=260; K.introFade=200;
             K.hoverLift=260; K.hoverDrop=200; K.activeDuration=300;
             K.orbitAz=0; K.orbitEl=0; }

const P = window.parent && window.parent.MN_DATA ? window.parent : null;
const DATA = P ? P.MN_DATA : {bab:[],eval:[]};
const APP = P ? P.MN_APP : null;
const BOOKS = DATA.bab.concat(DATA.eval).map((b,i)=>({
  id: b.id||('bab'+b.no), no:b.no, label:b.label, title:b.title, kj:b.kj, kjr:b.kjr, col:b.col, colL:b.colL, dur:b.dur,
  slides: b.slides ? b.slides.length : (b.no===7?13:20), shelf: i<4?0:1, slot: i%4, lessons:b.lessons, blurb:b.blurb,
  status:'new', score:0, at:1 }));
function syncStatus(){
  const pre = APP && APP.pre ? APP.pre() : null;
  let worst=null, worstPct=101;
  for(const b of BOOKS){
    b.status = APP ? APP.status(b.no) : 'new';
    if(b.no<=6){
      const st = APP ? APP.bab(b.no) : {seen:[],best:0};
      b.score = st.best||0; b.at = Math.max(1, Math.round((APP?APP.progress(b.no):0)*b.slides));
      if(pre && pre.perBab && pre.perBab[b.no] && b.status!=='done'){ const p=pre.perBab[b.no], pc=p[0]/p[1]*100; if(pc<worstPct){worstPct=pc;worst=b;} }
    }
    b.saran=false;
    b.lockMsg = b.no<=6 ? 'Selesaikan pre-test dulu untuk membuka bab.' : b.no===7 ? (()=>`Simulasi masih terkunci. Kumpulkan 6 stempel bab dulu (sekarang ${stampCount()} dari 6).`) : 'Post-test terbuka setelah kamu menyelesaikan Simulasi Mensetsu.';
  }
  if(worst && worstPct<100) worst.saran=true;
}
syncStatus();
for(const b of BOOKS){ b.edge='#efe8da'; b.cloth=shade(b.col,-0.45); b.spine=b.col; }
function shade(hex,k){
  const n=parseInt(hex.slice(1),16); let r=n>>16&255,g=n>>8&255,bl=n&255;
  const f=v=>Math.round(k<0? v*(1+k) : v+(255-v)*k);
  return '#'+[f(r),f(g),f(bl)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
const stampCount=()=>BOOKS.filter(b=>b.no<=6&&b.status==='done').length;
const studentName=()=> (APP&&APP.name()) || 'Peserta';
const metaLine=d=> d.no<=6 ? `${d.label} · ${d.dur} · ${d.slides} slide` : `${d.label} · ${d.dur}`;

const TAU = Math.PI*2;
const SANS  = 'Inter,-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif';
const SERIF = '"EB Garamond",Didot,"Bodoni 72",Georgia,"Times New Roman",serif';
const MONO  = 'ui-monospace,"SF Mono",Menlo,Monaco,Consolas,monospace';

const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp  = (a,b,t)=>a+(b-a)*t;
const smooth= t=>t<=0?0:t>=1?1:t*t*(3-2*t);
function mulberry(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function C(w,h){const c=document.createElement('canvas');c.width=w;c.height=h===undefined?w:h;return c;}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function lg(g,x0,y0,x1,y1,stops){const t=g.createLinearGradient(x0,y0,x1,y1);for(const s of stops)t.addColorStop(s[0],s[1]);return t;}
function rg(g,x,y,r0,r1,stops,x1,y1){const t=g.createRadialGradient(x,y,r0,x1===undefined?x:x1,y1===undefined?y:y1,r1);for(const s of stops)t.addColorStop(s[0],s[1]);return t;}
function tracked(g,text,x,y,track,align){
  let w=0;for(const ch of text)w+=g.measureText(ch).width+track;w-=track;
  let cx = align==='center'? x-w/2 : align==='right'? x-w : x;
  const prev=g.textAlign;g.textAlign='left';
  for(const ch of text){g.fillText(ch,cx,y);cx+=g.measureText(ch).width+track;}
  g.textAlign=prev;return w;
}
function fitTracked(g,text,w,weight,family,track){
  let lo=4,hi=3000;
  const meas=px=>{g.font=`${weight} ${px}px ${family}`;let t=0;for(const ch of text)t+=g.measureText(ch).width+track*px;return t-track*px;};
  for(let i=0;i<26;i++){const m=(lo+hi)/2;if(meas(m)>w)hi=m;else lo=m;}
  g.font=`${weight} ${lo}px ${family}`;return lo;
}
function grain(g,W,H,amount,seed){
  const r=mulberry(seed||7);const img=g.getImageData(0,0,W,H),d=img.data;
  for(let i=0;i<d.length;i+=4){const n=(r()-0.5)*amount;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}
  g.putImageData(img,0,0);
}
function cloth(g,W,H,seed,amt){
  const r=mulberry(seed||3);
  g.save();g.globalAlpha=amt===undefined?.05:amt;
  for(let y=0;y<H;y+=3){g.fillStyle=r()>.5?'#fff':'#000';g.fillRect(0,y,W,1);}
  for(let x=0;x<W;x+=3){g.fillStyle=r()>.5?'#fff':'#000';g.fillRect(x,0,1,H);}
  g.restore();
}
function rule(g,x0,y0,x1,y1,col,w){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();}

const FOIL = '#F7EFE0';
const MINCHO = '"Shippori Mincho","Noto Serif JP",serif';
const JPS = '"Noto Sans JP",sans-serif';

function seigaiha(g,W,H,s,col,alpha){
  g.save(); g.strokeStyle=col; g.globalAlpha=alpha; g.lineWidth=Math.max(1,s*0.045);
  for(let row=-1, y=0; y<H+s; row++, y=row*s*0.5){
    const off=(row&1)? s*0.5 : 0;
    for(let x=-s+off; x<W+s; x+=s){
      for(const k of [0.92,0.66,0.40,0.14]){ g.beginPath(); g.arc(x,y+s*0.5,s*0.5*k,Math.PI,TAU); g.stroke(); }
    }
  }
  g.restore();
}
function wrapText(g,text,x,y,maxW,lh){
  const words=text.split(' '); let line='';
  for(const w of words){ const t=line?line+' '+w:w;
    if(g.measureText(t).width>maxW&&line){ g.fillText(line,x,y); line=w; y+=lh; } else line=t; }
  if(line){ g.fillText(line,x,y); y+=lh; }
  return y;
}
function lockIcon(g,cx,cy,s,col){
  g.save(); g.strokeStyle=col; g.fillStyle=col; g.lineWidth=s*0.12; g.lineCap='round';
  rr(g,cx-s*0.5,cy-s*0.05,s,s*0.78,s*0.14); g.fill();
  g.beginPath(); g.arc(cx,cy-s*0.08,s*0.3,Math.PI,TAU); g.stroke();
  g.restore();
}
function hanko(g,cx,cy,r,label){
  g.save(); g.translate(cx,cy); g.rotate(-0.22);
  g.fillStyle='rgba(255,248,240,.92)'; g.beginPath(); g.arc(0,0,r,0,TAU); g.fill();
  g.strokeStyle='#B3282F'; g.lineWidth=r*0.1; g.beginPath(); g.arc(0,0,r*0.9,0,TAU); g.stroke();
  g.fillStyle='#B3282F'; g.textAlign='center'; g.textBaseline='middle';
  g.font=`700 ${r*0.92}px ${JPS}`; g.fillText('済',0,-r*0.08);
  g.font=`800 ${r*0.2}px ${SANS}`; g.fillText(label,0,r*0.58);
  g.restore();
}

function paintCover(b,W,H){
  const c=C(W,H),g=c.getContext('2d');
  g.fillStyle=b.col; g.fillRect(0,0,W,H);
  g.fillStyle=rg(g,W*.5,H*.50,W*.05,W*.95,[[0,'rgba(255,255,255,.16)'],[1,'rgba(0,0,0,.22)']]); g.fillRect(0,0,W,H);
  seigaiha(g,W,H*0.36,W*0.14,'#ffffff',0.13);
  // emblem ring behind the kanji
  g.strokeStyle='rgba(247,239,224,.42)'; g.lineWidth=W*.004;
  g.beginPath(); g.arc(W*.5,H*.53,W*.33,0,TAU); g.stroke();
  g.beginPath(); g.arc(W*.5,H*.53,W*.305,0,TAU); g.stroke();
  // hairline frame
  g.strokeStyle='rgba(247,239,224,.34)'; g.lineWidth=W*.0032; g.strokeRect(W*.052,H*.038,W*.896,H*.924);
  g.textAlign='center'; g.textBaseline='alphabetic'; g.fillStyle=FOIL;
  g.font=`700 ${W*.034}px ${SANS}`; tracked(g,b.label.toUpperCase(),W*.5,H*.115,W*.034*.32,'center');

  g.font=`800 ${s1}px ${SANS}`; g.fillText(b.title,W*.5,H*.115+s1*1.25);
  rule(g,W*.36,H*.115+s1*1.62,W*.64,H*.115+s1*1.62,'rgba(247,239,224,.5)',W*.0026);
  // kanji
  const ks=Math.min(W*.28, (W*.56)/b.kj.length*1.02);
  g.font=`800 ${ks}px ${MINCHO}`; g.fillStyle=FOIL; g.textBaseline='middle';
  g.fillText(b.kj,W*.5,H*.53);
  g.textBaseline='alphabetic';
  if(b.status!=='locked'){ g.font=`500 ${W*.03}px ${SANS}`; g.globalAlpha=.86; g.fillText(b.kjr,W*.5,H*.53+W*.40); }
  g.globalAlpha=1;
  // foot
  g.globalAlpha=.78; g.font=`600 ${W*.026}px ${SANS}`;
  g.fillText(b.no<=6? `${b.dur} · ${b.slides} slide` : b.dur,W*.5,H*.872);
  g.globalAlpha=.95; g.font=`800 ${W*.027}px ${SANS}`;
  tracked(g,'MENSETSU NAVI',W*.5,H*.918,W*.027*.3,'center');
  g.globalAlpha=1;
  grain(g,W,H,6,b.no*37+5);
  // status marks painted onto the board
  if(b.status==='done') hanko(g,W*.79,H*.685,W*.115,b.label.toUpperCase());
  if(b.status==='now'){
    const p=b.at/b.slides;
    g.fillStyle='rgba(0,0,0,.28)'; rr(g,W*.20,H*.835,W*.60,W*.016,W*.008); g.fill();
    g.fillStyle='#ffffff'; rr(g,W*.20,H*.835,W*.60*p,W*.016,W*.008); g.fill();
  }
  if(b.status==='locked'){
    g.save(); g.globalCompositeOperation='saturation'; g.fillStyle='#808080'; g.fillRect(0,0,W,H); g.restore();
    g.fillStyle='rgba(26,28,36,.42)'; g.fillRect(0,0,W,H);
    g.fillStyle='rgba(247,239,224,.94)'; g.beginPath(); g.arc(W*.5,H*.735,W*.07,0,TAU); g.fill();
    lockIcon(g,W*.5,H*.738,W*.064,'#2b2f3a');
    g.fillStyle=FOIL; g.font=`800 ${W*.03}px ${SANS}`; g.textAlign='center';
    tracked(g,'TERKUNCI',W*.5,H*.81,W*.03*.3,'center');

}

/* ---------- oak ---------- */
function woodTexture(px){
  const W=px, Hh=Math.round(px*0.5);
  const c=C(W,Hh),g=c.getContext('2d'),r=mulberry(909);
  g.fillStyle='#7d5228';g.fillRect(0,0,W,Hh);
  // sapwood/heartwood drift, kept low-contrast so it never reads as plywood
  for(let i=0;i<14;i++){
    g.fillStyle=`rgba(${146+r()*40|0},${98+r()*26|0},${48+r()*22|0},${.06+r()*.09})`;
    g.beginPath();g.ellipse(r()*W,r()*Hh,W*(.10+r()*.30),Hh*(.06+r()*.20),0,0,TAU);g.fill();
  }
  // the grain itself: many tight, slightly wandering lines
  for(let i=0;i<430;i++){
    const y0=r()*Hh, amp=Hh*(.004+r()*.020), f=0.6+r()*2.2, ph=r()*TAU;
    const dark=r()<.34;
    g.strokeStyle=dark
      ? `rgba(${38+r()*26|0},${22+r()*16|0},${9+r()*10|0},${.36+r()*.55})`
      : `rgba(${186+r()*40|0},${138+r()*32|0},${80+r()*26|0},${.14+r()*.32})`;
    g.lineWidth=dark?(0.8+r()*1.8):(0.8+r()*2.6);
    g.beginPath();
    for(let x=0;x<=W;x+=8){
      const y=y0+Math.sin(x/W*TAU*f+ph)*amp+Math.sin(x/W*TAU*f*2.7+ph*2)*amp*.4;
      x?g.lineTo(x,y):g.moveTo(x,y);
    }
    g.stroke();
  }
  // cathedral figure — a few nested arcs, low contrast
  for(let k=0;k<4;k++){
    const cx=W*(.1+r()*.8), cy=Hh*(.15+r()*.7), sw=W*(.02+r()*.05);
    for(let i=0;i<14;i++){
      g.strokeStyle=`rgba(${62+r()*26|0},${38+r()*18|0},${16+r()*12|0},${.12+r()*.20})`;
      g.lineWidth=0.8+r()*1.6;
      g.beginPath();
      g.moveTo(cx-sw*(1+i*.30),cy+Hh*.5);
      g.quadraticCurveTo(cx,cy-Hh*(.12+i*.05),cx+sw*(1+i*.30),cy+Hh*.5);
      g.stroke();
    }
  }
  // medullary rays + open pores
  for(let i=0;i<520;i++){
    g.fillStyle=`rgba(${208+r()*26|0},${172+r()*28|0},${118+r()*28|0},${.05+r()*.15})`;
    g.fillRect(r()*W,r()*Hh,1+r()*2,Hh*(.01+r()*.05));
  }
  for(let i=0;i<9000;i++){
    g.fillStyle=`rgba(${44+r()*28|0},${26+r()*16|0},${10+r()*10|0},${.12+r()*.34})`;
    g.fillRect(r()*W,r()*Hh,1+r()*4,1);
  }
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;
  return t;
}

/* tiling paper tooth — fibres, mottle and a fine grain */
function paperTexture(px){
  const c=C(px,px),g=c.getContext('2d'),r=mulberry(2027);
  g.fillStyle='#808080';g.fillRect(0,0,px,px);
  for(let i=0;i<70;i++){
    g.fillStyle=`rgba(${r()<.5?255:0},${r()<.5?255:0},${r()<.5?255:0},${.012+r()*.03})`;
    g.beginPath();g.ellipse(r()*px,r()*px,px*(.05+r()*.28),px*(.04+r()*.22),r()*TAU,0,TAU);g.fill();
  }
  for(let i=0;i<5200;i++){
    const x=r()*px,y=r()*px,l=1+r()*px*0.035,a=r()*TAU;
    g.strokeStyle=r()<.5?`rgba(255,255,255,${.03+r()*.11})`:`rgba(0,0,0,${.03+r()*.13})`;
    g.lineWidth=r()<.85?1:2;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();
  }
  const img=g.getImageData(0,0,px,px),d=img.data;
  for(let i=0;i<d.length;i+=4){const n=(r()-0.5)*40;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}
  g.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;
  t.minFilter=THREE.LinearMipmapLinearFilter;t.magFilter=THREE.LinearFilter;
  return t;
}
function wallTexture(px){
  const c=C(px,px),g=c.getContext('2d');
  const Ww=WALL.x1-WALL.x0, Hh=WALL.y1-WALL.y0;
  const img=g.createImageData(px,px), d=img.data;
  const PT=K.shelfTop, PB=[K.shelfTop[0]-K.plankThick, K.shelfTop[1]-K.plankThick];
  const sm=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
  const r=mulberry(5);
  for(let j=0;j<px;j++){
    const y = WALL.y1 - (j+0.5)/px*Hh;
    for(let i=0;i<px;i++){
      const x = WALL.x0 + (i+0.5)/px*Ww;
      const ax=Math.abs(x)/WT.bellR;
      let L = WT.peak - WT.bell*ax*ax + WT.rightLift*clamp(x/4,0,1);
      L -= WT.vFall*sm((WT.vStart-y)/WT.vRange)*sm((-x+2.8)/8.6);
      const inPlank = 1-sm((Math.abs(x)-WT.plankHalf)/WT.plankFeather);
      const inShadow = sm((x-WT.shLeft)/WT.shLeftFeather)*(1-sm((x-WT.shRight)/WT.shRightFeather));
      for(const pt of PT){
        const dy=y-pt; if(dy<0||dy>WT.bounceR) continue;
        L += WT.bounce*Math.pow(1-dy/WT.bounceR,WT.bouncePow)*inPlank;
      }
      const rb=sm((x+4.8)/9.6);
      let dy=PB[0]-y;
      if(dy>0&&dy<WT.shTopR) L *= 1-WT.shTop*(1-(1-WT.shRightMul)*rb)*Math.pow(1-dy/WT.shTopR,WT.shPow)*inShadow;
      dy=PB[1]-y;
      if(dy>0&&dy<WT.shBotR) L *= 1-WT.shBot*(1-(1-WT.shBotRightMul)*rb)*Math.pow(1-dy/WT.shBotR,WT.shPow)*inShadow;
      // the uprights sit proud of the wall and drop a soft edge shadow
      for(const ux of [-2.68,2.68]){
        const dx=x-ux;
        const s=Math.exp(-Math.pow((dx+ (ux<0?0.30:-0.06))/0.40,2));
        const band=sm((y+3.6)/1.6)*(1-sm((y-1.9)/1.7));   // no hard ends
        L *= 1-0.30*s*band;
      }
      const o=(j*px+i)*4;
      const n=(r()-0.5)*5;            // limewash tooth
      d[o]  =clamp((L+n)*WT.tint[0],0,255);
      d[o+1]=clamp((L+n)*WT.tint[1],0,255);
      d[o+2]=clamp((L+n)*WT.tint[2],0,255);
      d[o+3]=255;
    }
  }
  g.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;
  t.minFilter=THREE.LinearMipmapLinearFilter;t.magFilter=THREE.LinearFilter;
  return t;
}

    vertexShader:`
      varying vec3 vP; varying vec3 vN;

    fragmentShader:`
      uniform sampler2D uWood; uniform float uOpacity; uniform float uAxis;
      varying vec3 vP; varying vec3 vN;
      void main(){
        vec3 n=normalize(vN), an=abs(n);
        vec2 uvH, uvV, uvE;
        if(uAxis<0.5){                       // grain runs along X (shelves)
          uvH=vec2(vP.x*0.140, vP.z*0.30);
          uvV=vec2(vP.x*0.140, vP.y*0.44);
          uvE=vec2(vP.z*0.30,  vP.y*0.44);

          uvE=vec2(vP.z*0.30,  vP.x*0.55);

        vec3 wood=texture2D(uWood,uv).rgb;
        float up=max(n.y,0.0), dn=max(-n.y,0.0), fwd=max(n.z,0.0), side=abs(n.x);
        float t = 1.22*up + 0.14*dn + 0.86*fwd + 0.48*side;

/* ---- cover surface: printed board under a satin varnish ---- */
const BOARD_FN = `
  // height field of a bound board: a shallow bulge that falls into a crisp chamfer
  float board(vec2 t){
    vec2 c=t*2.0-1.0;
    float bulge=(1.0-c.x*c.x)*(1.0-0.55*c.y*c.y);
    float e=clamp(min(min(t.x,1.0-t.x),min(t.y,1.0-t.y))/uER,0.0,1.0);
    float roll=sqrt(max(1.0-(1.0-e)*(1.0-e),0.0));   // quarter round, sharp at the lip
    return uBow*bulge*roll-uChamf*(1.0-roll);
  }`;
const COVER_VS = `
  uniform float uBow, uChamf, uER, uW, uH;
  varying vec2 vUv; varying vec3 vT, vB2, vNf; varying vec3 vWV;
  ${BOARD_FN}
  void main(){
    vUv=uv;
    vec3 pos=position; pos.z+=board(uv);
    mat3 M=mat3(modelMatrix);
    vT=normalize(M*vec3(1.0,0.0,0.0));
    vB2=normalize(M*vec3(0.0,1.0,0.0));
    vNf=normalize(M*vec3(0.0,0.0,1.0));
    vec4 wp=modelMatrix*vec4(pos,1.0);
    vWV=cameraPosition-wp.xyz;
    gl_Position=projectionMatrix*viewMatrix*wp; }`;
const COVER_FS = `
  uniform sampler2D uTex; uniform float uSatin; uniform float uOpacity; uniform float uSeed;
  uniform float uBow, uChamf, uER, uW, uH;
  varying vec2 vUv; varying vec3 vT, vB2, vNf; varying vec3 vWV;
  ${BOARD_FN}
  float hash(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973));
    p3+=dot(p3,p3.yxz+33.33); return fract((p3.x+p3.y)*p3.z); }
  float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
  void main(){
    vec2 uv=clamp(vUv,0.0008,0.9992);
    vec4 tex=texture2D(uTex,uv);

    // the board normal is evaluated per pixel, so the chamfer stays crisp
    // however coarse the mesh is
    float d=0.0016;
    float hx=(board(uv+vec2(d,0.0))-board(uv-vec2(d,0.0)))/(2.0*d*uW);
    float hy=(board(uv+vec2(0.0,d))-board(uv-vec2(0.0,d)))/(2.0*d*uH);

    // linen tooth, as a small extra slope
    vec2 q=uv*vec2(58.0,78.0)+uSeed;
    float tooth=vnoise(q)*0.6+vnoise(q*2.7)*0.4;
    vec2 g2=uv*9.0+uSeed;
    float n1=vnoise(g2), e=0.02;
    vec2 grain=vec2(vnoise(g2+vec2(e,0.0))-n1, vnoise(g2+vec2(0.0,e))-n1)/e;

    vec3 N=normalize(vNf
      - vT*(hx + (grain.x*0.0022+(tooth-0.5)*0.009)*uSatin)
      - vB2*(hy + (grain.y*0.0022+(tooth-0.5)*0.009)*uSatin));
    vec3 V=normalize(vWV);

    // one key from above and to the right, a broad fill bounced off the paper wall
    vec3 L=normalize(vec3(0.52,0.70,0.55));
    vec3 F=normalize(vec3(-0.35,-0.18,0.92));
    float key=max(dot(N,L),0.0);
    float fill=max(dot(N,F),0.0);
    float shade=0.70+0.34*key+0.14*fill;
    vec3 col=tex.rgb*shade;

    // a tight specular that only fires on the chamfer, plus a broad satin lobe
    vec3 Hv=normalize(L+V);
    float nh=max(dot(N,Hv),0.0);
    col+=vec3(pow(nh,110.0)*0.85*uSatin);
    col+=vec3(pow(nh,14.0)*0.045*uSatin);
    float fres=pow(1.0-max(dot(N,V),0.0),3.4);
    col+=vec3(fres*0.055*uSatin);
    col+=vec3((tooth-0.5)*0.010*uSatin);

    gl_FragColor=vec4(min(col,vec3(1.0)),uOpacity);
    #include <colorspace_fragment>
  }`;
const SPINE_VS = `
  uniform float uHD;
  varying vec2 vUv; varying vec3 vNw, vTw, vBw, vWV; varying float vZ;
  void main(){
    vUv=uv;
    mat3 M=mat3(modelMatrix);
    vNw=normalize(M*normal);
    vTw=normalize(M*vec3(0.0,0.0,1.0));   // across the back
    vBw=normalize(M*vec3(0.0,1.0,0.0));   // head to tail
    vZ=position.z/uHD;
    vec4 wp=modelMatrix*vec4(position,1.0);
    vWV=cameraPosition-wp.xyz;
    gl_Position=projectionMatrix*viewMatrix*wp; }`;
const SPINE_FS = `
  uniform sampler2D uTex; uniform float uOpacity; uniform float uSeed; uniform float uSatin;
  varying vec2 vUv; varying vec3 vNw, vTw, vBw, vWV; varying float vZ;
  float hash(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973));
    p3+=dot(p3,p3.yxz+33.33); return fract((p3.x+p3.y)*p3.z); }
  float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
  void main(){
    vec4 tex=texture2D(uTex,clamp(vUv,0.0015,0.9985));
    float t=clamp(vZ,-1.0,1.0);
    // a hollow back: nearly flat down the middle, turning hard into the joints.
    // swept as an angle rather than a slope so the normal can reach the joints
    float ang=1.15*sign(t)*pow(abs(t),1.25);

    vec2 q=vUv*vec2(11.0,78.0)+uSeed;
    float tooth=vnoise(q)*0.6+vnoise(q*2.7)*0.4;
    vec3 N=normalize(vNw*cos(ang) + vTw*sin(ang)
                     + (vTw*0.009+vBw*0.009)*(tooth-0.5)*uSatin);
    vec3 V=normalize(vWV);

    vec3 L=normalize(vec3(0.52,0.70,0.55));
    vec3 F=normalize(vec3(-0.35,-0.18,0.92));
    float shade=0.70+0.34*max(dot(N,L),0.0)+0.14*max(dot(N,F),0.0);
    shade*=1.0-0.16*smoothstep(0.78,1.0,abs(t));      // the joint grooves
    vec3 col=tex.rgb*shade;

    // the key sits off to the right, so on the back it only ever grazes the
    // front joint — the bounce off the paper wall is what rakes the round
    vec3 Hv=normalize(L+V), Hf=normalize(F+V);
    float nh=max(dot(N,Hv),0.0), nf=max(dot(N,Hf),0.0);
    col+=vec3(pow(nh,110.0)*0.55*uSatin);
    col+=vec3(pow(nh,14.0)*0.045*uSatin);
    col+=vec3(pow(nf,46.0)*0.150*uSatin);
    col+=vec3(pow(nf,9.0)*0.032*uSatin);
    col+=vec3(pow(1.0-max(dot(N,V),0.0),3.4)*0.055*uSatin);
    col+=vec3((tooth-0.5)*0.010*uSatin);

    gl_FragColor=vec4(min(col,vec3(1.0)),uOpacity);
    #include <colorspace_fragment>
  }`;
function spineMaterial(tex,seed){
  return new THREE.ShaderMaterial({transparent:true,
    uniforms:{uTex:{value:tex},uOpacity:{value:0},uSeed:{value:seed},
              uSatin:{value:1.0},uHD:{value:K.bookD*0.5}},
    vertexShader:SPINE_VS,fragmentShader:SPINE_FS});
}
function pagesMaterial(col){
  return new THREE.ShaderMaterial({
    transparent:true,
    uniforms:{uCol:{value:new THREE.Color(col)},uOpacity:{value:0},uH:{value:K.bookH*0.5}},
    vertexShader:`
      varying vec3 vP; varying vec3 vNw; varying vec3 vWV;
      void main(){ vP=position; vNw=normalize(mat3(modelMatrix)*normal);
        vec4 wp=modelMatrix*vec4(position,1.0);
        vWV=cameraPosition-wp.xyz;
        gl_Position=projectionMatrix*viewMatrix*wp; }`,
    fragmentShader:`
      uniform vec3 uCol; uniform float uOpacity; uniform float uH;
      varying vec3 vP; varying vec3 vNw; varying vec3 vWV;
      void main(){
        float f=vP.z*210.0;
        float w=fwidth(f);
        float line=0.5+0.5*cos(f*6.2831853);
        line=mix(0.5,line,clamp(1.0-w*1.6,0.0,1.0));
        vec3 col=uCol*0.88*mix(0.76,1.04,line);
        col*=1.0-0.16*smoothstep(0.25,1.0,abs(vP.y)/uH);
        col*=0.90+0.10*smoothstep(-0.09,0.09,vP.z);

        // the same rig as the boards, so the block turns with the volume
        vec3 N=normalize(vNw), V=normalize(vWV);
        vec3 L=normalize(vec3(0.52,0.70,0.55));
        vec3 F=normalize(vec3(-0.35,-0.18,0.92));
        float shade=0.70+0.34*max(dot(N,L),0.0)+0.14*max(dot(N,F),0.0);
        shade*=1.0-0.36*max(-N.y,0.0);      // the tail sits in its own shadow
        col*=shade/0.871;                   // 0.871 holds the fore-edge at its old tone
        // paper carries no real specular, only a graze
        col+=uCol*pow(1.0-max(dot(N,V),0.0),3.2)*max(dot(N,L),0.0)*0.11;
        gl_FragColor=vec4(min(col,vec3(1.0)),uOpacity);
        #include <colorspace_fragment>
      }`});
}

/* ---- tweens ---- */
const easeOutQuart=t=>1-Math.pow(1-t,4);
const easeSettle  =t=>t<0.5? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const activeEase  =t=>t<0.3? 0.3*Math.pow(t/0.3,3) : 0.3+0.7*(1-Math.pow(1-(t-0.3)/0.7,3));
let NOW=0;
class Tw{
  constructor(v){this.v=v.slice();this.from=v.slice();this.to=v.slice();this.t0=0;this.d=0;this.e=easeOutQuart;}
  start(to,d,e,delay){this.from=this.v.slice();this.to=to.slice();this.t0=NOW+(delay||0);this.d=Math.max(d,1);this.e=e||easeOutQuart;}
  set(to){this.v=to.slice();this.from=to.slice();this.to=to.slice();this.d=0;}
  update(){ if(this.d<=0)return;
    let t=(NOW-this.t0)/this.d; if(t<0)return; if(t>=1){t=1;this.d=0;}
    const k=this.e(t); for(let i=0;i<this.v.length;i++)this.v[i]=this.from[i]+(this.to[i]-this.from[i])*k; }
}
class Spring{
  constructor(v,tension,friction,mass){this.v=v.slice();this.tgt=v.slice();this.vel=v.map(()=>0);
    this.k=tension;this.c=friction;this.m=mass||1;}
  start(t){this.tgt=t.slice();}
  update(dt){dt=Math.min(dt,1/30);
    for(let i=0;i<this.v.length;i++){
      const a=(this.k*(this.tgt[i]-this.v[i])-this.c*this.vel[i])/this.m;
      this.vel[i]+=a*dt;this.v[i]+=this.vel[i]*dt;}}
}

/* ---- one volume ---- */
const SZW=K.bookW, SZH=K.bookH, SZD=K.bookD;
const bodyGeo=new THREE.BoxGeometry(SZW,SZH,SZD);
const faceGeo=new THREE.PlaneGeometry(SZW,SZH,44,44);
const hitGeo =new THREE.PlaneGeometry(SZW*1.06,SZH*0.98);
const mPos=(i,scroll)=>{
  const k=i-(scroll||0);
  if(k>=0) return [0, K.mY + k*K.mStepY, K.mZ0 - k*K.mStepZ];
  return [0, K.mY + k*0.86, K.mZ0 - k*0.14];
};
const slotX=i=>(i-1.5)*K.slot;
function bookBase(b){
  if(MOBILE) return mPos(b.index,0);
  return [slotX(b.data.slot), K.shelfTop[b.data.shelf]+(SZH/2)*Math.cos(b._lean), K.bookZ];
}

const KARTU_KOSONG=(()=>{ const t=new THREE.CanvasTexture(artKartuKosong(512,417)); t.colorSpace=THREE.SRGBColorSpace; return t; })();
function buildBook(data,index){
  const rnd=mulberry(index*7919+13);
  const B={data,index,flipped:false};
  B._lean=K.lean+(rnd()-0.5)*0.075;
  B._yaw = K.yaw+(rnd()-0.5)*0.045;
  B._roll=(rnd()-0.5)*0.018;
  B.rest=[B._lean,B._yaw,B._roll];
  B.restTilt=MOBILE?K.mTilt:B._lean;
  B.base=[0,0,0.01];
  B.basePos=bookBase(B);

  const gRoot=new THREE.Group(); gRoot.position.set(...B.basePos);
  const gHover=new THREE.Group(); gHover.position.set(...B.base);
  const gWob=new THREE.Group();
  const gTilt=new THREE.Group(); gTilt.rotation.set(...(MOBILE?[K.mTilt,0,0]:B.rest));
  const gScl=new THREE.Group(); gScl.scale.setScalar(0);
  gRoot.add(gHover); gHover.add(gWob); gWob.add(gTilt); gTilt.add(gScl);
  scene.add(gRoot);

  const coverTex=new THREE.CanvasTexture(paintCover(data,768,1152));
  B.coverTex=coverTex;
  coverTex.colorSpace=THREE.SRGBColorSpace; coverTex.anisotropy=8;
  const spineTex=new THREE.CanvasTexture(artSpine(data,142,1152));
  B.spineTex=spineTex;
  spineTex.colorSpace=THREE.SRGBColorSpace; spineTex.anisotropy=8;

  const pages=pagesMaterial(data.edge);
  const spineMat=spineMaterial(spineTex,index*5.7);
  const clothMat=new THREE.MeshBasicMaterial({color:new THREE.Color(data.cloth),transparent:true,opacity:0});
  // the title page sits under the front board, so opening the volume reveals it
  const titleTex=new THREE.CanvasTexture(artTitlePage(data,768,1152));
  titleTex.colorSpace=THREE.SRGBColorSpace; titleTex.anisotropy=8;
  const titleMat=new THREE.MeshBasicMaterial({map:titleTex,transparent:true,opacity:0});
  const body=new THREE.Mesh(bodyGeo,[pages,spineMat,pages,pages,titleMat,clothMat]);
  gScl.add(body);

  const mk=(tex,satin,seed)=>new THREE.ShaderMaterial({transparent:true,
    uniforms:{uTex:{value:tex},uSatin:{value:satin},uOpacity:{value:0},uSeed:{value:seed},
              uBow:{value:K.bow},uChamf:{value:K.chamf},uER:{value:K.chamfR},

  const coverMat=mk(coverTex,1.0,index*7.3);
  const cover=new THREE.Mesh(faceGeo,coverMat);
  // the front board hangs on a hinge at the spine
  const hinge=new THREE.Group(); hinge.position.set(-SZW/2,0,SZD/2+K.chamf+0.0008); gScl.add(hinge);
  cover.position.set(SZW/2,0,0); hinge.add(cover);
  // kartu putih kosong tepat di atas kartu isi halaman judul (x 4–96 %, y 44–94 % dari atas), tak terlihat kecuali saat selam
  const blankMat=new THREE.MeshBasicMaterial({map:KARTU_KOSONG,transparent:true,opacity:0,depthWrite:false});
  const blank=new THREE.Mesh(new THREE.PlaneGeometry(SZW*0.92,SZH*0.50),blankMat);
  blank.position.set(0,(0.5-0.69)*SZH,SZD/2+0.0006); gScl.add(blank);
  const endTex=new THREE.CanvasTexture(artEndpaper(data,384,576)); endTex.colorSpace=THREE.SRGBColorSpace;
  const endMat=new THREE.MeshBasicMaterial({map:endTex,transparent:true,opacity:0});
  const endp=new THREE.Mesh(new THREE.PlaneGeometry(SZW*0.99,SZH*0.99),endMat);
  endp.rotation.y=Math.PI; endp.position.set(SZW/2,0,-0.016); hinge.add(endp);
  const backMat=mk(coverTex,0.55,index*3.1+11);
  const back=new THREE.Mesh(faceGeo,backMat);
  back.position.z=-SZD/2-K.chamf-0.0008; back.rotation.y=Math.PI; gScl.add(back);
  B.backLoaded=false;
  B.loadBack=()=>{ if(B.backLoaded)return; B.backLoaded=true;
    const t=new THREE.CanvasTexture(artBack(data,768,1152));
    t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;backMat.uniforms.uTex.value=t; };

  const hit=new THREE.Mesh(hitGeo,new THREE.MeshBasicMaterial({visible:false}));
  hit.position.set(B.basePos[0],B.basePos[1],B.basePos[2]-0.04);
  hit.rotation.x=MOBILE?K.mTilt:B._lean;
  hit.rotation.y=MOBILE?0:B._yaw;
  hit.userData.book=B;
  scene.add(hit);

  const wallSh=new THREE.Mesh(new THREE.PlaneGeometry(2.20,2.70),
    new THREE.MeshBasicMaterial({map:SHADOW_TEX,transparent:true,opacity:0,depthWrite:false,color:0x241c12}));
  wallSh.position.set(B.basePos[0]-0.05,B.basePos[1]-0.04,K.wallZ+0.004);
  scene.add(wallSh);

  const footZ=K.bookZ+(SZH/2)*Math.sin(-B._lean);            // where the boards meet the plank
  const csBack=footZ-SZD*0.5-0.045;                          // just behind the boards
  const csFront=K.wallZ+K.plankDepth-0.035;                   // stops short of the plank's nose
  const csDepth=csFront-csBack;
  const cs=new THREE.Mesh(new THREE.PlaneGeometry(SZW*1.42,csDepth),
    new THREE.MeshBasicMaterial({map:CONTACT_TEX,transparent:true,opacity:0,depthWrite:false,color:0x241a10}));
  cs.rotation.x=-Math.PI/2;
  cs.position.set(B.basePos[0],K.shelfTop[data.shelf]+0.0022,csBack+csDepth*0.5);

  const crease=new THREE.Mesh(new THREE.PlaneGeometry(SZW*1.16,0.075),
    new THREE.MeshBasicMaterial({map:CREASE_TEX,color:0x1a1208,transparent:true,opacity:0,depthWrite:false}));
  crease.position.set(B.basePos[0],K.shelfTop[data.shelf]+0.030,footZ+SZD*0.5+0.004);
  scene.add(crease);

  let refl=null;
  const reflMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,
    uniforms:{uTex:{value:coverTex},uOpacity:{value:0}},
    vertexShader:`varying vec2 vUv; void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`
      uniform sampler2D uTex; uniform float uOpacity; varying vec2 vUv;
      float hash(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973));
        p3+=dot(p3,p3.yxz+33.33);return fract((p3.x+p3.y)*p3.z);}
      void main(){
        float mappedY=mix(0.0,0.22,1.0-vUv.y);
        float edge=min(min(smoothstep(0.0,0.06,vUv.y),smoothstep(0.0,0.12,1.0-vUv.y)),
                       min(smoothstep(0.0,0.06,vUv.x),smoothstep(0.0,0.06,1.0-vUv.x)));
        float b=0.004+0.02*(1.0-edge);
        vec4 col=(texture2D(uTex,vec2(vUv.x+b,mappedY))+texture2D(uTex,vec2(vUv.x-b,mappedY))
                 +texture2D(uTex,vec2(vUv.x,mappedY+b*0.5))+texture2D(uTex,vec2(vUv.x,mappedY-b*0.5)))*0.25;
        float fade=vUv.y*vUv.y*1.7;
        float sp=hash(vUv*220.0);
        gl_FragColor=vec4(col.rgb,uOpacity*fade*(1.0-sp*0.34)*edge);
        #include <colorspace_fragment>
      }`});
  refl=new THREE.Mesh(new THREE.PlaneGeometry(SZW,0.60),reflMat);
  refl.rotation.x=-Math.PI/2;
  refl.position.set(B.basePos[0],K.shelfTop[data.shelf]+0.0012,footZ+0.24);
  scene.add(refl);

  Object.assign(B,{gRoot,gHover,gWob,gTilt,gScl,body,cover,back,coverMat,backMat,spineMat,
    clothMat,pages,hit,wallSh,cs,crease,refl,reflMat,hinge,titleMat,endMat,blankMat,kosong:0,shakeT:0,
    tCover:new Tw([0]),
    tHover:new Tw([...B.base]), tTilt:new Tw(MOBILE?[K.mTilt,0,0]:[...B.rest]),
    sWob:new Spring([0,0,0],80,6,1),
    tActiveP:new Tw([...B.basePos]), tActiveR:new Tw([0,0,0]),
    tScale:new Tw([0]), tRefl:new Tw([0.34]), tFade:new Tw([0]), tSeat:new Tw([1])});
  if(MOBILE){wallSh.visible=false;cs.visible=false;crease.visible=false;refl.visible=false;
             gRoot.renderOrder=100-index;}
  return B;
}

/* ---- state ---- */
const S={anim:'intro',active:null,lifted:null};
function hoverIn(B,dur){
  const d=dur===undefined?K.hoverLift:dur;
  B.tHover.start([B.base[0],B.base[1]+0.085,B.base[2]+0.075],d,easeOutQuart);
  B.tTilt.start([0,0,0],d,easeOutQuart);
  B.sWob.start([0,0,0]);
  B.tRefl.start([0],d*0.45,easeOutQuart);
  B.loadBack();
}
function hoverOut(B){
  const d=K.hoverDrop;
  B.tHover.start([...B.base],d,easeSettle);
  B.tTilt.start(MOBILE?[B.restTilt,0,0]:[...B.rest],d,easeSettle,d*0.22);
  B.tRefl.start([0.34],d,easeSettle);
  B.sWob.start([0,0,0]);
}
function activeZ(){
  const camZ=camera.position.z;
  const fill=MOBILE?0.86:0.60;
  const halfH=(SZH*0.5)/fill;
  const dv=halfH/Math.tan(K.fov*Math.PI/360);
  const halfW=(SZW*0.5)/fill;
  const dh=halfW/(Math.tan(K.fov*Math.PI/360)*camera.aspect);
  return camZ-Math.max(dv,dh);
}
function toActive(B){
  S.anim='animatingForward'; hoverIn(B);
  B.tSeat.start([0],K.activeDuration*0.55,easeSettle,K.activeDuration*0.12);
  const ay = MOBILE ? mobileTargetY() : K.boxCY-0.02;
  B.tActiveP.start([MOBILE?0:K.activeX,ay,activeZ()],K.activeDuration,activeEase);
  B.tActiveR.start([...K.activeRot],K.activeDuration,activeEase);
  B.gRoot.renderOrder=10; setLayer(B,LAY_FG);
  setTimeout(()=>{ if(S.active===B) S.anim='active'; },K.activeDuration);
}
function toInactive(B){
  S.anim='animatingBackward'; B.flipped=false;
  B.tSeat.start([1],K.activeDuration*0.62,easeSettle,K.activeDuration*0.38);
  B.tHover.start([B.base[0],B.base[1]+0.06,B.base[2]],K.activeDuration,easeOutQuart);
  B.tActiveP.start([...B.basePos],K.activeDuration,activeEase);
  B.tActiveR.start([...K.activeRot],K.activeDuration,activeEase);
  setTimeout(()=>hoverOut(B),K.activeDuration);
  setTimeout(()=>{ S.anim='inactive'; setLayer(B,LAY_BG);
                   B.gRoot.renderOrder=MOBILE?100-B.index:0;
                   if(S.lifted===B)S.lifted=null; },K.activeDuration+20);
}
function setLayer(B,l){ B.gRoot.traverse(o=>o.layers.set(l)); }
const BUSY=['intro','animatingForward','animatingBackward','opening','open','closing'];
function setActive(B){
  if(!B||BUSY.includes(S.anim))return;
  if(B.data.status==='locked'){shake(B);return;}
  if(S.active===B)return;
  if(S.active){clearActive();return;}
  S.active=B;S.lifted=B;toActive(B);
  showDetail(B);
}
function clearActive(){
  if(!S.active)return;
  if(S.anim==='open'){closeBab();return;}
  if(S.anim==='opening'||S.anim==='closing')return;
  const B=S.active;S.active=null;
  detailEl.classList.remove('on');document.body.classList.remove('reading');WASH.target=0;hintEl.classList.remove('on');
  mDetails.textContent='Detail'; if(MOBILE) fillMbar(BOOKS[M.index]);
  dragReset();
  toInactive(B);
  if(B._pop){ B._pop=false;
    setTimeout(()=>{ const el=tl.children[B.index]; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); },K.activeDuration+60); }
}
/* a locked volume refuses: it rattles in place and says why */
function shake(B){
  if(!B)return;
  B.shakeT=NOW||performance.now();
  try{ if(navigator.vibrate) navigator.vibrate([28,40,28]); }catch(e){}
  const m=B.data.lockMsg; toast((typeof m==='function'?m():m)||'Bab ini belum bisa dibuka.');
}
function flipActive(){
  const B=S.active; if(!B||S.anim!=='active')return;
  B.flipped=!B.flipped; B.loadBack();
  B.tActiveR.start([K.activeRot[0],K.activeRot[1]+(B.flipped?Math.PI:0),K.activeRot[2]],
                   K.activeDuration,activeEase);
}
/* how close the opened title page comes: just past filling the screen */
function pushZ(){
  const tan=Math.tan(K.fov*Math.PI/360);
  const dv=(SZH*0.5)/tan, dh=(SZW*0.5)/(tan*camera.aspect);
  return camera.position.z-Math.min(dv,dh)*0.80;
}
/* Buka: the board swings open on its hinge, the volume squares up,
   then travels into the title page, which becomes the chapter cover screen.
   Laptop dengan gerak penuh memakai "selam" (lihat mulaiSelam): halaman materi sudah disusun aplikasi saat tombol ditekan,
   kamera menyelam ke halaman judul tanpa berhenti, dan halaman materi muncul dari dalam halaman judul itu. */
function openBab(B){
  if(!B)return;
  if(B.data.status==='locked'){shake(B);return;}
  if(S.active!==B){
    if(BUSY.includes(S.anim)||S.active)return;
    setActive(B); setTimeout(()=>openBab(B),K.activeDuration+60); return;
  }
  if(S.anim!=='active')return;
  // "kurangi gerak" dari perangkat atau dari Pengaturan aplikasi: buka singkat, tanpa selam
  const kurang=REDUCED||!!(APP&&APP.gerakKurang&&APP.gerakKurang());
  // halaman tujuan disusun sekarang, sebelum ada yang bergerak, supaya kerja beratnya tidak memotong animasi
  let selam=false;
  if(!MOBILE&&!kurang&&APP&&APP.masukBuku){ try{ selam=!!APP.masukBuku(B.data.no); }catch(err){ selam=false; } }
  if(selam) NOW=performance.now();          // jam animasi dimulai setelah penyusunan, jadi tidak ada lompatan di awal
  S.anim='opening'; B.flipped=false; dragReset(); B.sWob.start([0,0,0]);
  detailEl.classList.remove('on'); WASH.target=0; hintEl.classList.remove('on');
  document.body.style.cursor='default'; document.body.classList.add('opening');
  const ay=(MOBILE?mobileTargetY():K.boxCY)-B.tHover.v[1];
  const D=kurang?240:K.openDur;
  B.tActiveR.start([0,0,0],D,activeEase);
  B.tActiveP.start([0,ay,activeZ()],D,activeEase);
  B.tCover.start([K.coverOpen],kurang?1:D*0.96,activeEase,kurang?0:D*0.16);
  if(selam){ mulaiSelam(B,D); return; }
  setTimeout(()=>{
    if(S.anim!=='opening')return;
    const P=kurang?1:K.pushDur;
    B.tActiveP.start([0,ay,pushZ()-B.tHover.v[2]],P,easeSettle);
    setTimeout(()=>showOverlay(B),kurang?0:P*0.42);
    setTimeout(()=>{ if(S.anim==='opening') S.anim='open'; },P+80);
  },kurang?240:D*0.9);
}

/* Selam: kamera masuk ke halaman judul, dan halaman materi menempel di halaman itu (match-move).
   Zoom diukur dalam skala logaritmik (tinggi halaman judul ÷ tinggi layar), jadi laju membesarnya terasa rata.
   - mulai saat sampul ±70 % terbuka (0,62 × durasi buka), jadi gerak buka dan selam menyambung tanpa jeda;
   - buku bergeser sehingga titik bidik (kartu isi halaman judul: judul, ringkasan, daftar pelajaran) tiba di tengah layar
     sebelum halaman materi muncul;
   - saat halaman judul setinggi layar, halaman materi muncul sebagai kartu tepat di atas kartu isi itu (APP.ukurBuku:
     skala = zoom ÷ zoom penuh, jadi kartu dan halaman 3D membesar bersama sebagai satu benda) dan memudar masuk 0,2 dtk;
   - selaman berhenti melambat tepat saat lebar kartu isi (92 % halaman) = lebar layar: kartu memenuhi layar, APP.tibaBuku();
   - begitu halaman judul menutupi layar, latar rak dan blur-nya tidak digambar lagi (tidak terlihat, GPU lebih ringan). */
const SELAM={on:false,B:null,t0:0,d:920,dist0:1,zoom0:1,zoom:1,aimV:0.62,kartu:0,ended:false,tutup:false};
const tanFov=()=>Math.tan(K.fov*Math.PI/360);
const zoomAt=dist=>SZH/(2*dist*tanFov());          // tinggi halaman judul dibanding tinggi layar
const distFor=zoom=>SZH/(2*zoom*tanFov());
const zoomCover=()=>camera.aspect*(SZH/SZW);         // pada zoom ini lebar halaman = lebar layar
function mulaiSelam(B,D){
  const fit=Math.max((SZH*0.5)/(0.60*tanFov()),(SZW*0.5)/(0.60*tanFov()*camera.aspect));   // jarak akar buku pada activeZ()
  const dist0=fit-B.tHover.v[2]-SZD/2;                                                     // jarak halaman judul ke kamera
  Object.assign(SELAM,{on:true,B,t0:NOW+D*0.62,d:920,dist0,zoom0:zoomAt(dist0),zoom:zoomAt(dist0),kartu:0,ended:false,tutup:false});
  document.body.classList.add('menyelam');
}
/* dipanggil sekali per frame: [geser y, geser z] untuk buku yang diselami, dan menyetir kartu halaman materi di aplikasi */
function majuSelam(){
  const s=SELAM, zc=zoomCover(), zEnd=zc/0.92;           // akhir: lebar kartu isi (92 % halaman) = lebar layar
  const t=clamp((NOW-s.t0)/s.d,0,1), e=easeSettle(t);
  s.zoom=s.zoom0*Math.pow(zEnd/s.zoom0,e);
  s.tutup=s.zoom>=zc;
  // isi kartu halaman judul memudar jadi kertas kosong dulu (zoom 0,70 → 0,95), baru halaman materi muncul di atasnya:
  // teks judul dan teks halaman materi tidak pernah tampil bertumpuk
  s.B.kosong=smooth(clamp((s.zoom-0.70)/0.25,0,1));
  // kartu halaman materi: mulai saat halaman judul setinggi layar (jendela sempit: lebih awal), ikut membesar bersama halaman 3D
  if(!s.kartu&&s.zoom>=Math.min(1,zEnd*0.62)){ s.kartu=NOW; }
  if(s.kartu&&APP&&APP.ukurBuku){
    const o=smooth(clamp((NOW-s.kartu)/200,0,1));
    try{ APP.ukurBuku(s.zoom/zEnd,o); }catch(err){}
  }
  if(t>=1&&!s.ended){
    s.ended=true; if(S.anim==='opening') S.anim='open';
    try{ if(APP&&APP.tibaBuku) APP.tibaBuku(); }catch(err){}
  }
  // titik bidik ditaruh tepat di garis pandang kamera (kamera sedikit menunduk, jadi garis itu tidak datar)
  // jarak halaman ke kamera dibuat persis distFor(zoom), jadi di akhir lebar halaman = lebar layar tepat sama dengan kartu
  const B=s.B, zPage=camera.position.z-distFor(s.zoom);
  const oz=zPage-(B.tActiveP.v[2]+B.tHover.v[2]+SZD/2);
  const yAxis=TGT.y+(camera.position.y-TGT.y)*(zPage-TGT.z)/(camera.position.z-TGT.z);
  const yAim=B.tActiveP.v[1]+B.tHover.v[1]+(0.5-s.aimV)*SZH;
  const w=smooth(clamp(t/0.4,0,1));                       // bidikan selesai sebelum kartu muncul
  return [(yAxis-yAim)*w, oz];
}
/* Kembali ke rak: the screen lifts away, the volume backs out, closes, and is shelved */
function closeBab(){
  const B=S.active; if(!B||S.anim!=='open')return;
  if(SELAM.on){ snapBack(); return; }   // setelah selam, rak sudah tersembunyi; kembali ke rak = langsung di rak
  S.anim='closing';
  for(const x of books) if(x._repaint){ x._repaint=false; repaint(x); }
  renderRail();
  const ay=MOBILE?mobileTargetY():K.boxCY-0.02;
  const D=REDUCED?240:K.openDur, w=REDUCED?0:180;
  B.tActiveP.start([MOBILE?0:K.activeX,ay,activeZ()],D,activeEase,w);
  B.tActiveR.start([...K.activeRot],D,activeEase,w);
  B.tCover.start([0],REDUCED?1:D*0.8,easeSettle,REDUCED?0:w+120);
  setTimeout(()=>{ document.body.classList.remove('opening'); S.anim='active'; clearActive(); },D+w+60);
}

/* ════════════════════════════════════════════════════════════════════════
   5 · CAMERA (orbits toward the pointer) + BLUR COMPOSITE
   ════════════════════════════════════════════════════════════════════════ */
let VW=1,VH=1,DIST=12;
const ORB={tx:0,ty:0,x:0,y:0};
const TGT=new THREE.Vector3();
function mobileTargetY(){
  const tan=Math.tan(K.fov*Math.PI/360);
  const D=DIST-K.mZ0;
  const stackTop=K.mY+(BOOKS.length-1)*K.mStepY+SZH*0.5*Math.cos(K.mTilt);
  return Math.max(K.mY+K.mDrop*D*tan, stackTop-0.80*D*tan);
}

let CAMD=1;
function applyCamera(){
  const damp=CAMD;

  const el=0.0025-ORB.y*K.orbitEl*damp;
  TGT.set(0, MOBILE?mobileTargetY():K.boxCY, 0);
  camera.position.set(
    TGT.x+Math.sin(az)*Math.cos(el)*DIST,

function frameCamera(){
  const aspect=VW/VH, tan=Math.tan(K.fov*Math.PI/360);

    camera.near=Math.max(DIST-9,0.1); camera.far=DIST+26;
  } else {
    const distV=K.boxY/(2*tan), distH=K.boxX/(2*tan*aspect);
    let d=K.offset*Math.max(distV,distH);
    const projW=VW*K.boxX/(2*d*tan*aspect);
    if(projW>K.maxWidthPx) d=VW*K.boxX/(2*K.maxWidthPx*tan*aspect);
    DIST=d;

function hash1(i){ let x=Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); }
function vnoise1(t,seed){
  const i=Math.floor(t), f=t-i, u=f*f*(3-2*f);
  return lerp(hash1(i+seed*97.3), hash1(i+1+seed*97.3), u);
}
function hash2(x,y){ let v=Math.sin(x*12.9898+y*78.233)*43758.5453; return v-Math.floor(v); }

/* the torn band: solid on the left, breaking into fibres on the right */
function buildTearBand(TW,h){
  const oct=[[1/430,44],[1/170,21],[1/74,10.5],[1/31,5.0],[1/13,2.4],[1/6,1.2]];
  const edge=new Float32Array(h);
  for(let y=0;y<h;y++){
    let e=TW*0.42;
    for(let k=0;k<oct.length;k++) e+=(vnoise1(y*oct[k][0],k+1)-0.5)*2*oct[k][1];
    edge[y]=e;
  }
  const a=new Float32Array(TW*h);
  for(let y=0;y<h;y++){
    const e=edge[y];
    const fib=5+17*vnoise1(y/8.5,11);          // fibre length varies down the tear
    for(let x=0;x<TW;x++){
      const t=(x-e)/fib;
      let v;
      if(t<=0) v=1;
      else if(t>=1.35) v=0;
      else {
        // break the falloff up so it reads as fibres rather than a soft cut
        const n=hash2(Math.floor(x*0.9),Math.floor(y*0.75))*0.62
               +hash2(Math.floor(x*2.4)+37,Math.floor(y*2.1)+11)*0.38;
        v=clamp(1.18-t-(n-0.5)*0.95,0,1);
        v=v*v*(3-2*v);
      }
      a[y*TW+x]=v;
    }
  }
  return a;
}
function tintBand(a,TW,h,r,g0,b0,edgeDark){
  const c=C(TW,h), g=c.getContext('2d');
  const img=g.createImageData(TW,h), d=img.data;
  for(let i=0;i<TW*h;i++){
    const v=a[i];
    let k=1;
    if(edgeDark&&v>0.02&&v<0.97) k=0.86+0.14*v;   // compressed fibres at the tear
    d[i*4]=r*k; d[i*4+1]=g0*k; d[i*4+2]=b0*k;
    d[i*4+3]=v*255;
  }
  g.putImageData(img,0,0);
  return c;
}
function buildSheet(){
  const w=WASH.w,h=WASH.h;
  if(w<8||h<8) return;
  const TW=Math.min(210,Math.round(w*0.34));
  const X0=Math.max(0,w-TW-46);
  const a=buildTearBand(TW,h);
  const paper=tintBand(a,TW,h,219,202,175,true);
  const dark =tintBand(a,TW,h,86,68,46,false);
  const cv=C(w,h), g=cv.getContext('2d');
  // the sheet casts a soft shadow onto the scene behind it
  const BL=40;                       // the sheet bleeds past the left edge of the canvas
  g.save(); g.globalAlpha=0.34; g.filter=`blur(${Math.round(h*0.020)}px)`;
  g.fillStyle='#56432e'; g.fillRect(-BL,0,X0+16+BL,h);
  g.drawImage(dark,X0+16,0);
  g.restore();
  // the sheet itself
  const pg=g.createLinearGradient(0,0,w,0);
  pg.addColorStop(0,'rgb(222,206,180)');
  pg.addColorStop(0.72,'rgb(219,202,175)');
  pg.addColorStop(1,'rgb(213,195,167)');
  g.fillStyle=pg; g.fillRect(-BL,0,X0+1+BL,h);
  g.drawImage(paper,X0,0);
  // fibre grain, only where there is paper
  g.globalCompositeOperation='source-atop';
  const r=mulberry(913);
  for(let i=0;i<2600;i++){
    const x=r()*w, y=r()*h, l=2+r()*26, ang=(r()-0.5)*0.5;
    g.strokeStyle=r()<0.5?`rgba(255,250,240,${0.02+r()*0.05})`:`rgba(120,98,70,${0.02+r()*0.05})`;
    g.lineWidth=r()<0.85?1:2;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(ang)*l,y+Math.sin(ang)*l); g.stroke();
  }
  g.fillStyle='rgba(255,252,244,0.05)';
  g.fillRect(-BL,0,w+BL,h*0.5);
  g.globalCompositeOperation='source-over';
  WASH.sheet=cv; WASH.travel=X0+TW+60;
}
function washResize(){
  const w=Math.max(1,washEl.clientWidth), h=Math.max(1,washEl.clientHeight);
  washEl.width=w; washEl.height=h; WASH.w=w; WASH.h=h;
  buildSheet(); WASH.dirty=true;
}
function drawWash(){
  const w=WASH.w,h=WASH.h,t=WASH.t;
  wctx.clearRect(0,0,w,h);
  if(t<=0.002||!WASH.sheet) return;
  wctx.drawImage(WASH.sheet,-(1-t)*WASH.travel,0);
}

    if(Math.hypot(e.clientX-TAP.x,e.clientY-TAP.y)<10&&!S.active){
      ptr.x=(e.clientX/VW)*2-1; ptr.y=-(e.clientY/VH)*2+1; ray.setFromCamera(ptr,camera);
      if(ray.intersectObjects(books.map(b=>b.hit),false).length) setActive(books[M.index]); }
    return; }
  if(!DRAG.on)return;
  DRAG.on=false;
  try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
  document.body.style.cursor='grab';
  if(DRAG.moved<10) flipActive();               // a tap still turns the volume over
});
addEventListener('pointercancel',()=>{ DRAG.on=false; TAP.on=false; });
addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(!menu.hidden){menu.hidden=true;return;} if(S.anim==='open')closeBab(); else if(S.active)clearActive(); return; }
  if(e.target.closest&&e.target.closest('button,a,input'))return;
  if((e.key===' '||e.code==='Space')&&S.active&&S.anim==='active'){e.preventDefault();flipActive();}
  if(e.key==='Enter'&&S.active&&S.anim==='active'){e.preventDefault();openBab(S.active);}
});

/* ════════════════════════════════════════════════════════════════════════
   7 · MODE, INTRO, RENDER LOOP
   ════════════════════════════════════════════════════════════════════════ */
function applyMode(){
  document.body.classList.toggle('mobile',MOBILE);
  furniture.visible=!MOBILE;
  wall.visible=true;
  for(const B of books){
    B.basePos=bookBase(B);
    B.restTilt=MOBILE?K.mTilt:B._lean;
    if(B!==S.active){
      B.tActiveP.set([...B.basePos]);
      B.tTilt.set(MOBILE?[K.mTilt,0,0]:[...B.rest]);
      B.tHover.set([...B.base]);
    }
    B.hit.position.set(B.basePos[0],B.basePos[1],B.basePos[2]-0.04);
    B.hit.rotation.x=MOBILE?K.mTilt:B._lean; B.hit.rotation.y=MOBILE?0:B._yaw;
    B.wallSh.visible=!MOBILE; B.cs.visible=!MOBILE; B.crease.visible=!MOBILE; B.refl.visible=!MOBILE;
    B.gRoot.renderOrder=MOBILE?100-B.index:0;
  }
  if(MOBILE)setMobileIndex(M.index,true);
  frameCamera();
}
MOBILE_Q.addEventListener('change',e=>{MOBILE=e.matches;applyMode();});

const wallFade=new Tw([0]);
function revealChrome(){
  const step=REDUCED?0:1;
  for(const el of document.querySelectorAll('.rise')){
    el.style.setProperty('--d',(+el.dataset.d||0)*step+'ms');
  }
  // one reflow so the delays are in place before the class that plays them
  void document.body.offsetHeight;
  for(const el of document.querySelectorAll('.rise')) el.classList.add('in');
}
function startIntro(){
  // the volumes are already shelved — they only fade up, no tipping or settling
  S.anim='intro';
  wallFade.start([1],K.introWallFade,easeOutQuart);
  books.forEach((B,i)=>{
    B.tScale.set([1]);
    B.tHover.set([...B.base]);
    B.tTilt.set(MOBILE?[B.restTilt,0,0]:[...B.rest]);
    B.tFade.set([0]);
    B.tFade.start([1],K.introFade,easeOutQuart,i*K.introStagger);
  });
  setTimeout(()=>{ if(S.anim==='intro')S.anim='inactive'; },
             K.introWallFade+books.length*K.introStagger);
}


let last=performance.now();
let PAUSED=false, LOOP=false;
function tick(now){
  if(PAUSED){ LOOP=false; return; }
  LOOP=true; requestAnimationFrame(tick);
  NOW=now; const dt=Math.min((now-last)/1000,0.05); last=now;

  // during the intro the camera snaps to the pointer instead of easing, so the
  // shelf never swings into place on load
  {
    const tg=WASH.target, k2=Math.min(1,dt*(tg>WASH.t?5.2:8.5));
    if(Math.abs(tg-WASH.t)>0.0009||WASH.dirty){ WASH.t+=(tg-WASH.t)*k2; WASH.dirty=false; drawWash(); }
  }
  const k=(S.anim==='intro')?1:Math.min(1,dt*3.4);
  ORB.x+=(ORB.tx-ORB.x)*k; ORB.y+=(ORB.ty-ORB.y)*k;
  CAMD+=(camDampTarget()-CAMD)*(S.anim==='intro'?1:Math.min(1,dt*5.5));
  applyCamera();
  const sel=SELAM.on?majuSelam():null;

  wallFade.update();
  const wf=wallFade.v[0];
  wallMat.uniforms.uOpacity.value=wf; oakH.uniforms.uOpacity.value=wf; oakV.uniforms.uOpacity.value=wf;

  if(MOBILE){
    if(!S.active) M.scroll+=(M.target-M.scroll)*Math.min(1,dt*9);
    setMobileIndex(Math.round(M.scroll));
    for(const B of books){
      B.basePos=mPos(B.index,M.scroll);
      if(B===S.active||S.anim==='animatingBackward')continue;
      B.tActiveP.v[0]=B.basePos[0];B.tActiveP.v[1]=B.basePos[1];B.tActiveP.v[2]=B.basePos[2];
      B.tActiveP.d=0;
      const u=clamp(M.scroll-B.index,0,1.6);
      B.tTilt.v[0]=lerp(K.mTilt,K.mFlat,smooth(Math.min(u,1))); B.tTilt.d=0;
      B.mFade=1-smooth(clamp((u-0.28)/0.5,0,1));
      B.gRoot.visible=B.mFade>0.01 && B.index-M.scroll<9.5;
    }
  }

  for(const B of books){
    B.tHover.update();B.tTilt.update();B.tActiveP.update();B.tActiveR.update();
    B.tScale.update();B.tRefl.update();B.tFade.update();B.tSeat.update();B.sWob.update(dt);
    B.gHover.position.set(B.tHover.v[0],B.tHover.v[1],B.tHover.v[2]);
    B.gTilt.rotation.set(B.tTilt.v[0],B.tTilt.v[1],B.tTilt.v[2]);
    let sh=0;
    if(B.shakeT){ const t=(NOW-B.shakeT)/1000;
      if(t<0.6) sh=Math.sin(t*44)*Math.exp(-t*5.5)*(REDUCED?0.03:0.085); else B.shakeT=0; }
    B.gWob.rotation.set(B.sWob.v[0],B.sWob.v[1]+sh,B.sWob.v[2]+sh*0.45);
    B.gWob.position.x=sh*0.14;
    if(sel&&B===SELAM.B) B.gRoot.position.set(B.tActiveP.v[0],B.tActiveP.v[1]+sel[0],B.tActiveP.v[2]+sel[1]);
    else B.gRoot.position.set(B.tActiveP.v[0],B.tActiveP.v[1],B.tActiveP.v[2]);
    B.gRoot.rotation.set(B.tActiveR.v[0],B.tActiveR.v[1],B.tActiveR.v[2]);
    B.gScl.scale.setScalar(B.tScale.v[0]);
    const op=B.tFade.v[0]*wf*(MOBILE&&B.mFade!==undefined&&B!==S.active?B.mFade:1);
    B.clothMat.opacity=op; B.spineMat.uniforms.uOpacity.value=op;
    B.pages.uniforms.uOpacity.value=op;
    B.coverMat.uniforms.uOpacity.value=op;
    B.backMat.uniforms.uOpacity.value=op;
    B.titleMat.opacity=op; B.endMat.opacity=op; B.blankMat.opacity=op*B.kosong;
    B.tCover.update(); B.hinge.rotation.y=B.tCover.v[0];
    if(!MOBILE){
      const lift=B.tHover.v[1], away=clamp((B.tHover.v[2]-B.base[2])/0.075,0,1);
      B.wallSh.position.x=B.basePos[0]-0.09-away*0.05;
      B.wallSh.position.y=B.basePos[1]+lift-0.04+away*0.02;
      B.wallSh.scale.setScalar((1+away*0.13)*(B.tScale.v[0]||0.0001));
      const seat=B.tSeat.v[0];                                   // 1 on the shelf, 0 in the hand
      B.wallSh.material.opacity=(0.50-away*0.15)*op*seat;
      B.cs.material.opacity=(0.92*(1-away*0.55))*op*seat;
      B.crease.material.opacity=(0.55*(1-away))*op*seat;
      B.reflMat.uniforms.uOpacity.value=B.tRefl.v[0]*op*seat;
      B.refl.position.z=K.bookZ+(SZH/2)*Math.sin(-B._lean)+0.24+B.tHover.v[2]*2;
    }
  }

  const wantBlur=(S.anim==='animatingForward'||S.anim==='active'||S.anim==='opening'||S.anim==='open'||S.anim==='closing');
  if(blurTw._w!==wantBlur){blurTw._w=wantBlur;
    blurTw.i.start([wantBlur?16:0],460,t=>t,100);
    blurTw.n.start([wantBlur?6:1],400,t=>t,100);}
  blurTw.i.update();blurTw.n.update();

  const act=S.anim!=='intro'&&S.anim!=='inactive';
  if(sel&&SELAM.tutup){
    // halaman judul sudah menutupi layar: latar rak + blur tidak terlihat, jadi tidak digambar
    renderer.setRenderTarget(null);
    renderer.clear(true,true,false);
  } else {
    camera.layers.set(LAY_BG);
    renderer.setRenderTarget(rt);
    renderer.clear(true,true,false);
    renderer.render(scene,camera);
    renderer.setRenderTarget(null);
    passMat.uniforms.ignoreBlur.value=!act;
    passMat.uniforms.intensity.value=blurTw.i.v[0];
    passMat.uniforms.noiseScale.value=blurTw.n.v[0];
    renderer.clear(true,true,false);
    renderer.render(quadScene,quadCam);
  }
  if(act){
    renderer.clearDepth();
    camera.layers.set(LAY_FG);
    renderer.render(scene,camera);
  }
}

/* ---- boot ---- */
const loader=document.getElementById('loader'), barfill=document.getElementById('barfill');
const setProgress=p=>barfill.style.transform=`scaleX(${p})`;
setProgress(0.06);
const frame=()=>new Promise(r=>{let done=false;const go=()=>{if(!done){done=true;r();}};
  requestAnimationFrame(go);setTimeout(go,34);});

(async function boot(){
  try{ await Promise.race([Promise.all(['800 40px "Plus Jakarta Sans"','700 40px "Plus Jakarta Sans"','600 40px "Plus Jakarta Sans"','500 40px "Plus Jakarta Sans"','800 40px "Shippori Mincho"','700 40px "Noto Sans JP"'].map(f=>document.fonts.load(f,'面接報連相入室自己紹介質疑応答退室模擬修了済Ab'))),new Promise(r=>setTimeout(r,3500))]); }catch(e){}
  setProgress(0.10);
  setProgress(0.16);
  if(!document.hidden) await frame();
  for(let i=0;i<BOOKS.length;i++){
    books.push(buildBook(BOOKS[i],i));
    setProgress(0.16+0.80*(i+1)/BOOKS.length);
    if(!document.hidden) await frame();
  }
  applyMode();
  resize(); washResize();
  setProgress(1);
  LOOP=true; requestAnimationFrame(tick);
  await frame(); await frame();
  loader.classList.add('gone');
  canvas.classList.add('on');
  revealChrome();
  document.querySelector('footer').classList.add('on');
  mbar.classList.add('on');
  startIntro();
})();

/* ---- control from the app shell ---- */
function snapBack(){
  const B=S.active;
  if(B){
    B.flipped=false; dragReset();
    B.tCover.set([0]); B.tActiveP.set([...B.basePos]); B.tActiveR.set([...K.activeRot]);
    B.tHover.set([...B.base]); B.tTilt.set(MOBILE?[B.restTilt,0,0]:[...B.rest]); B.tSeat.set([1]); B.tRefl.set([0.34]);
    B.sWob.v=[0,0,0]; B.sWob.vel=[0,0,0]; B.sWob.tgt=[0,0,0];
    setLayer(B,LAY_BG); B.gRoot.renderOrder=MOBILE?100-B.index:0;
  }
  if(S.lifted&&S.lifted!==B) hoverOut(S.lifted);
  S.active=null; S.lifted=null; if(S.anim!=='intro') S.anim='inactive';
  if(SELAM.B) SELAM.B.kosong=0;
  SELAM.on=false; SELAM.B=null; SELAM.tutup=false;
  detailEl.classList.remove('on'); WASH.target=0; hintEl.classList.remove('on');
  document.body.classList.remove('reading','opening','menyelam');
  mDetails.textContent='Detail';
}
window.MN_RAK_RESET=function(){
  const before=BOOKS.map(b=>b.status+'|'+b.at+'|'+b.saran);
  syncStatus();
  books.forEach((B,i)=>{ if(before[i]!==BOOKS[i].status+'|'+BOOKS[i].at+'|'+BOOKS[i].saran){ repaint(B); if(BOOKS[i].status==='done'&&before[i].split('|')[0]!=='done') B._pop=true; } });
  snapBack(); renderRail(); if(MOBILE) fillMbar(BOOKS[M.index]);
  books.forEach((B,i)=>{ if(B._pop){ B._pop=false; setTimeout(()=>{ const el=tl.children[i]; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); },300); } });
};
window.MN_RAK_PAUSE=function(p){ PAUSED=!!p; if(!PAUSED&&!LOOP&&books.length){ LOOP=true; last=performance.now(); requestAnimationFrame(tick); } };
